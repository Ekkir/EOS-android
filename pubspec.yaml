name: eos
description: "EOS — Traffic Management System"
publish_to: 'none'
version: 1.1.89+91

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Map
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Network
  http: ^1.2.0

  # State & storage
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # Auth & Firebase
  google_sign_in: ^6.2.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # Media
  image_picker: ^1.1.0
  file_picker: ^10.0.0
  video_player: ^2.9.0
  record: ^7.0.0
  audioplayers: ^6.1.0
  camera: ^0.11.0

  # WebView
  webview_flutter: ^4.0.0

  # Permissions & system
  permission_handler: ^11.3.0
  url_launcher: ^6.3.0
  workmanager: ^0.9.0
  open_file: ^3.3.2
  geolocator: ^13.0.0
  device_info_plus: ^10.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "EOS.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/splash.mp4
    - assets/stockholm.conf
