name: eos
description: "EOS — Traffic Management System"
publish_to: 'none'
version: 1.1.22+24

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Map
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Network
  http: ^1.2.0

  # State & storage
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # Auth & Firebase
  google_sign_in: ^6.2.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # Media
  image_picker: ^1.1.0

  # Permissions & system
  permission_handler: ^11.3.0
  url_launcher: ^6.3.0
  workmanager: ^0.5.0
  open_file: ^3.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
